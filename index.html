<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GREEN-API Тестовое задание DevOps</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .header {
      background: #1e3c2f;
      padding: 25px 30px;
      color: white;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 48px;
      height: 48px;
      background: #4caf50;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
    }

    .title h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .title p {
      font-size: 13px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .content {
      padding: 30px;
    }

    .credentials {
      background: #f0f7f0;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 25px;
      border: 1px dashed #4caf50;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1e3c2f;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #d0e0d0;
      border-radius: 10px;
      font-size: 14px;
      transition: 0.3s;
      background: white;
    }

    input:focus {
      outline: none;
      border-color: #4caf50;
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    button {
      padding: 14px 10px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: white;
      border: 2px solid #e0e0e0;
      color: #333;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    button.primary {
      background: #1e3c2f;
      color: white;
      border: 2px solid #1e3c2f;
    }

    button.primary:hover {
      background: #2c5539;
    }

    button.accent {
      background: #4caf50;
      color: white;
      border: 2px solid #4caf50;
    }

    button.accent:hover {
      background: #43a047;
    }

    .response-area {
      background: #1a1f2b;
      border-radius: 16px;
      padding: 20px;
      color: #e0e0e0;
    }

    .response-area h3 {
      font-size: 14px;
      text-transform: uppercase;
      color: #4caf50;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    #responseOutput {
      background: #0d1117;
      border-radius: 10px;
      padding: 18px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 300px;
      overflow-y: auto;
      color: #c9d1d9;
      line-height: 1.6;
      min-height: 100px;
      border: 1px solid #30363d;
    }

    #responseOutput.success {
      border-left: 4px solid #4caf50;
    }

    #responseOutput.error {
      border-left: 4px solid #f85149;
      color: #f85149;
    }

    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .actions {
        grid-template-columns: 1fr;
      }

      .content {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">G</div>
      <div class="title">
        <h1>GREEN-API Console</h1>
        <p>DevOps Integration Test</p>
      </div>
    </div>

    <div class="content">
      <!-- Блок параметров подключения -->
      <div class="credentials">
        <div class="input-group">
          <label for="idInstance">idInstance</label>
          <input type="text" id="idInstance" placeholder="Введите ваш idInstance" value="">
        </div>
        <div class="input-group">
          <label for="apiTokenInstance">ApiTokenInstance</label>
          <input type="text" id="apiTokenInstance" placeholder="Введите ApiTokenInstance" value="">
        </div>
      </div>

      <!-- Кнопки вызова методов -->
      <div class="actions">
        <button onclick="callGetSettings()" class="primary">
          <span>⚙️</span> getSettings
        </button>
        <button onclick="callGetStateInstance()">
          <span>📡</span> getStateInstance
        </button>
        <button onclick="callSendMessage()" class="accent">
          <span>✉️</span> sendMessage
        </button>
        <button onclick="callSendFileByUrl()">
          <span>📎</span> sendFileByUrl
        </button>
      </div>

      <!-- Поле вывода ответа только для чтения -->
      <div class="response-area">
        <h3>📋 Результат выполнения</h3>
        <div id="responseOutput">Введите параметры подключения и нажмите кнопку метода. Ответ API отобразится здесь.</div>
      </div>
      <div class="hint">
        Время выполнения: до 3 дней | Для проверки опубликовать на GitHub Pages
      </div>
    </div>
  </div>

  <script>
    // Получение введенных параметров инстанса
    function getCredentials() {
      const idInstance = document.getElementById('idInstance').value.trim();
      const apiTokenInstance = document.getElementById('apiTokenInstance').value.trim();
      
      if (!idInstance || !apiTokenInstance) {
        showError('Ошибка: Введите idInstance и ApiTokenInstance');
        return null;
      }
      return { idInstance, apiTokenInstance };
    }

    // Отображение ответа в поле для чтения
    function displayResponse(data, isError = false) {
      const output = document.getElementById('responseOutput');
      output.classList.remove('success', 'error');
      
      if (isError) {
        output.classList.add('error');
        output.textContent = data;
      } else {
        output.classList.add('success');
        output.textContent = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
      }
    }

    function showError(message) {
      displayResponse(message, true);
    }

    // Универсальная функция вызова GREEN-API
    async function callApi(method, body = null) {
      const creds = getCredentials();
      if (!creds) return;

      const { idInstance, apiTokenInstance } = creds;
      const baseUrl = `https://api.green-api.com/waInstance${idInstance}`;
      
      let url = '';
      let options = {
        method: 'GET',
        headers: {}
      };

      // Формирование запросов согласно документации GREEN-API
      switch (method) {
        case 'getSettings':
          url = `${baseUrl}/getSettings/${apiTokenInstance}`;
          break;
        case 'getStateInstance':
          url = `${baseUrl}/getStateInstance/${apiTokenInstance}`;
          break;
        case 'sendMessage':
          url = `${baseUrl}/sendMessage/${apiTokenInstance}`;
          options.method = 'POST';
          options.headers['Content-Type'] = 'application/json';
          if (!body || !body.chatId) {
            showError('Для sendMessage необходимо указать chatId (в формате 7XXXXXXXXXX@c.us)');
            return;
          }
          options.body = JSON.stringify({
            chatId: body.chatId,
            message: body.message || 'Тестовое сообщение от GREEN-API Devops'
          });
          break;
        case 'sendFileByUrl':
          url = `${baseUrl}/sendFileByUrl/${apiTokenInstance}`;
          options.method = 'POST';
          options.headers['Content-Type'] = 'application/json';
          if (!body || !body.chatId || !body.urlFile) {
            showError('Для sendFileByUrl необходимы chatId и urlFile');
            return;
          }
          options.body = JSON.stringify({
            chatId: body.chatId,
            urlFile: body.urlFile,
            fileName: body.fileName || 'file.jpg',
            caption: body.caption || ''
          });
          break;
        default:
          showError('Неизвестный метод');
          return;
      }

      try {
        displayResponse('Выполнение запроса...');
        const response = await fetch(url, options);
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.message || `HTTP ошибка: ${response.status}`);
        }
        
        displayResponse(data);
      } catch (error) {
        showError(`Ошибка выполнения: ${error.message}`);
      }
    }

    // Обработчики для каждой кнопки
    function callGetSettings() {
      callApi('getSettings');
    }

    function callGetStateInstance() {
      callApi('getStateInstance');
    }

    function callSendMessage() {
      // Запрашиваем chatId у пользователя (по ТЗ должен быть реализован ввод, но для простоты используем prompt)
      // Можно заменить на статическое поле ввода, если требуется по макету.
      const chatId = prompt('Введите номер получателя в формате 7XXXXXXXXXX@c.us\nПример: 79001234567@c.us', '79001234567@c.us');
      if (chatId) {
        callApi('sendMessage', { 
          chatId: chatId, 
          message: 'Привет! Это тестовое сообщение GREEN-API (DevOps task).' 
        });
      }
    }

    function callSendFileByUrl() {
      const chatId = prompt('Введите номер получателя для файла (7XXXXXXXXXX@c.us):', '79001234567@c.us');
      if (!chatId) return;
      
      const fileUrl = prompt('Введите прямую ссылку на файл (urlFile):', 'https://green-api.com/img/logo.svg');
      if (fileUrl) {
        callApi('sendFileByUrl', {
          chatId: chatId,
          urlFile: fileUrl,
          fileName: 'test-file.jpg',
          caption: 'Отправлено через GREEN-API DevOps'
        });
      }
    }

    // Автозаполнение для тестирования (можно удалить)
    // document.getElementById('idInstance').value = '1101000000';
    // document.getElementById('apiTokenInstance').value = 'your-token';
  </script>
</body>
</html>
